x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  ccbuilder2-web:
    build:
      context: ./ccbuilder2/
      dockerfile: ./web/Dockerfile
    environment:
      - CCBMK2_CONFIG=production
    # ports:
    #   - "1801:80"
    # volumes:
    #   - ./web:/app
    depends_on:
      - ccbuilder2-db
    restart: unless-stopped
    logging: *default-logging
  # ccbuilder2-optimisation:
  #   build:
  #     context: ./ccbuilder2/
  #     dockerfile: ./optimisation/Dockerfile
  #   environment:
  #     - PYTHONUNBUFFERED=0
  #     - OPT_PROCS=6
  #   volumes:
  #     - ./optimisation:/app
  #   depends_on:
  #     - ccbuilder2-db
  ccbuilder2-db:
    image: mongo
    restart: unless-stopped
    logging: *default-logging
